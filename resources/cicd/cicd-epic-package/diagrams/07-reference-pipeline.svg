-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="145.752" x="147.0408" y="558.4199">no PATs) - enforces ADR</text><rect fill="#EEF3FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="145.7363" x="175.1326" y="591.25"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="125.7363" x="185.1326" y="612.3887">Peer review (human)</text><rect fill="#F1F8E9" height="284.1094" style="stroke:#000000;stroke-width:1.5;" width="444.8262" x="26.5876" y="647.2188"/><path d="M236.8191,647.2188 L236.8191,656.5156 L226.8191,666.5156 L26.5876,666.5156 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.2314" x="29.5876" y="661.2139">Merge to main -&gt; dev (auto)</text><rect fill="#EEF3FA" height="33.9688" rx="12.5" ry="12.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="200.3223" x="147.8396" y="683.5156"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="180.3223" x="157.8396" y="704.6543">Build wheel (shared logic, D9)</text><rect fill="#EEF3FA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="180.459" x="157.7712" y="737.4844"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="160.459" x="167.7712" y="758.623">bundle deploy --target dev</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="80.2383" x="167.7712" y="772.5918">(SP via OIDC)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1.0;" width="424.8262" x="36.5876" y="805.4219"/><rect fill="#EEF3FA" height="47.9375" rx="12.5" ry="12.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="189.7344" x="48.5876" y="838.4063"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="1