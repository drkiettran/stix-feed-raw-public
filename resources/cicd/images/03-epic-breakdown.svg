<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="696px" preserveAspectRatio="none" style="width:774px;height:696px;background:#FFFFFF;" version="1.1" viewBox="0 0 774 696" width="774px" zoomAndPan="magnify"><title>Epic Breakdown - Stories, Dependencies, and Parallel Tracks (19 pts)</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="546.8545" x="107.0386" y="22.9951">Epic Breakdown - Stories, Dependencies, and Parallel Tracks (19 pts)</text><!--entity S1--><g id="elem_S1"><rect fill="#FFF8E1" height="85.1875" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="238.5518" x="12.5" y="109.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="206.2402" x="22.5" y="132.722">S1 - CI/CD Standard (ADR)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="218.5518" x="22.5" y="149.0189">3 pts | spike -&gt; decision record</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="196.8066" x="22.5" y="165.3157">Branching, targets, identity,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="162.791" x="22.5" y="181.6126">secrets, gates, rollback</text></g><!--entity S2--><g id="elem_S2"><rect fill="#EEF3FA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="244.3076" x="7" y="262.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="224.3076" x="17" y="285.722">S2 - Job Template + Pipeline</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.7373" x="17" y="302.0189">5 pts | reference DABs bundle,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.9727" x="17" y="318.3157">CI validate/deploy, dev-&gt;prod</text></g><!--entity S3--><g id="elem_S3"><rect fill="#EEF3FA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="190.5361" x="62.5" y="391.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="97.3506" x="72.5" y="414.722">S3 - Job SOP</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.5361" x="72.5" y="431.0189">2 pts | step-by-step doc,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="118.207" x="72.5" y="447.3157">links to template</text></g><!--entity S4--><g id="elem_S4"><rect fill="#EEF3FA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="250.3369" x="286" y="262.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="230.3369" x="296" y="285.722">S4 - App Template + Pipeline</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="198.8438" x="296" y="302.0189">5 pts | app resource, grants,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.2529" x="296" y="318.3157">source sync + apps deploy</text></g><!--entity S5--><g id="elem_S5"><rect fill="#EEF3FA" height="68.8906" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="186.1133" x="303" y="391.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="103.3799" x="313" y="414.722">S5 - App SOP</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="166.1133" x="313" y="431.0189">2 pts | incl. app identity</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="110.585" x="313" y="447.3157">&amp; access model</text></g><!--entity S6--><g id="elem_S6"><rect fill="#E8F5E9" height="68.8906" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="256.9541" x="141.5" y="520.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="236.9541" x="151.5" y="543.722">S6 - Pilot Validation &amp; Publish</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.3838" x="151.5" y="560.0189">2 pts | external team deploys</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.7734" x="151.5" y="576.3157">using docs only</text></g><!--entity DEP--><g id="elem_DEP"><rect fill="#FFEBEE" height="101.4844" rx="2.5" ry="2.5" style="stroke:#6B8CB8;stroke-width:0.5;" width="242.8242" x="286.5" y="101.7269"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="215.2295" x="296.5" y="124.722">Dependency risk (external)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="222.8242" x="296.5" y="141.0189">Service principal provisioning +</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="170.0713" x="296.5" y="157.3157">CI auth (OIDC / secrets).</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.6025" x="296.5" y="173.6126">If owned by cloud/IAM team,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.3652" x="296.5" y="189.9095">split into its own ticket.</text></g><g id="elem_GMN17"><path d="M564.5,132.2269 L564.5,172.4925 L767.9316,172.4925 L767.9316,142.2269 L757.9316,132.2269 L564.5,132.2269 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M757.9316,132.2269 L757.9316,142.2269 L767.9316,142.2269 L757.9316,132.2269 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.3286" x="570.5" y="149.2938">Blocks everything.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="182.4316" x="570.5" y="164.4266">Do first; approve as a team.</text></g><g id="elem_GMN20"><path d="M131.5,649.7269 L131.5,689.9925 A0,0 0 0 0 131.5,689.9925 L408.9644,689.9925 A0,0 0 0 0 408.9644,689.9925 L408.9644,659.7269 L398.9644,649.7269 L274,649.7269 L270,589.9769 L266,649.7269 L131.5,649.7269 A0,0 0 0 0 131.5,649.7269 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M398.9644,649.7269 L398.9644,659.7269 L408.9644,659.7269 L398.9644,649.7269 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="256.4644" x="137.5" y="666.7938">Track A (S2-&gt;S3) and Track B (S4-&gt;S5)</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="21.8232" x="137.5" y="681.9266">run</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="73.6836" x="163.4556" y="681.9266">in parallel</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="94.7451" x="241.2715" y="681.9266">after S1 lands.</text></g><!--link S1 to S2--><g id="link_S1_S2"><path d="M131.12,194.9769 C130.67,216.4069 130.2548,236.1882 129.8348,256.3682 " fill="none" id="S1-to-S2" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="129.71,262.3669,133.8964,253.4521,129.814,257.368,125.8981,253.2856,129.71,262.3669" style="stroke:#555555;stroke-width:1.0;"/></g><!--link S1 to S4--><g id="link_S1_S4"><path d="M213.07,194.7769 C255.07,216.3069 300.3404,239.5102 339.8704,259.7702 " fill="no