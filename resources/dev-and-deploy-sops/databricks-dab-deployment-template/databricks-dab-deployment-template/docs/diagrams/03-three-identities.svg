<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="630px" preserveAspectRatio="none" style="width:843px;height:630px;background:#FFFFFF;" version="1.1" viewBox="0 0 843 630" width="843px" zoomAndPan="magnify"><title>The Three Identities - Who Is Acting, When?</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="347.3477" x="240.97" y="22.9951">The Three Identities - Who Is Acting, When?</text><!--entity dev--><g id="elem_dev"><ellipse cx="78.9326" cy="51.2969" fill="#E6F4EA" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M78.9326,59.2969 L78.9326,86.2969 M65.9326,67.2969 L91.9326,67.2969 M78.9326,86.2969 L65.9326,101.2969 M78.9326,86.2969 L91.9326,101.2969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="100.5088" x="28.6782" y="115.792">1. Developer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8652" x="6" y="132.0889">(your personal login)</text></g><!--entity dsp--><g id="elem_dsp"><rect fill="#FEF7E0" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="177.8555" x="187" y="54.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="140.5742" x="205.6406" y="77.792">2. Deployment SP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.8555" x="197" y="94.0889">(one per environment:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.9141" x="204.9707" y="110.3857">staging SP, prod SP)</text></g><!--entity asp--><g id="elem_asp"><rect fill="#FCE8E6" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="182.4834" x="494" y="227.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="76.0293" x="547.2271" y="250.792">3. App SP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.4834" x="504" y="267.0889">(auto-created PER APP,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="122.6367" x="523.9233" y="283.3857">per environment)</text></g><!--entity t_dev--><g id="elem_t_dev"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="93.0488" x="32.5" y="244.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="73.0488" x="42.5" y="267.292">dev target</text></g><!--entity t_sp--><g id="elem_t_sp"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="172.168" x="190" y="244.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.168" x="200" y="267.292">staging / prod targets</text></g><!--entity app--><g id="elem_app"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189.3057" x="240.5" y="398.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.3057" x="250.5" y="421.792">Running Databricks App</text></g><!--entity cat--><g id="elem_cat"><path d="M221.5,561.7969 C221.5,551.7969 335.126,551.7969 335.126,551.7969 C335.126,551.7969 448.752,551.7969 448.752,561.7969 L448.752,603.3906 C448.752,613.3906 335.126,613.3906 335.126,613.3906 C335.126,613.3906 221.5,613.3906 221.5,603.3906 L221.5,561.7969 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M221.5,561.7969 C221.5,571.7969 335.126,571.7969 335.126,571.7969 C335.126,571.7969 448.752,571.7969 448.752,561.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="145.8379" x="262.207" y="588.792">Environment catalog</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.252" x="231.5" y="605.0889">(tables, volumes, warehouse)</text></g><g id="elem_GMN14"><path d="M524,373.7969 L524,459.4609 L836.2876,459.4609 L836.2876,383.7969 L826.2876,373.7969 L524,373.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M826.2876,373.7969 L826.2876,383.7969 L836.2876,383.7969 L826.2876,373.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="12.4033" x="530" y="390.8638">1.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.752" x="546.5356" y="390.8638">1 newcomer trap: granting catalog access</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.4946" x="550.8965" y="405.9966">to yourself or the deployment SP does</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.5967" x="538.8455" y="421.1294">NOT grant it to the app. The app's own SP</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5088" x="553.8894" y="436.2622">needs grants in EVERY environment -</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.6455" x="554.321" y="451.395">"works in dev, 403 in staging" = this.</text></g><!--link dev to t_dev--><g id="link_dev_t_dev"><path d="M79,136.1169 C79,171.7369 79,213.1569 79,238.1669 " fill="none" id="dev-to-t_dev" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="79,244.1669,83,235.1669,79,239.1669,75,235.1669,79,244.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.5317" x="84.7893" y="178.8638">deploys &amp; runs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.1104" x="80" y="193.9966">(inner loop only)</text></g><!--link dsp to t_sp--><g id="link_dsp_t_sp"><path d="M276,124.0769 C276,160.2869 276,210.3169 276,238.2469 " fill="none" id="dsp-to-t_sp" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="276,244.2469,280,235.2469,276,239.2469,272,235.2469,276,244.2469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.0313" x="309.7603" y="178.8638">deploys bundles</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.5518" x="277" y="193.9966">(SOP today, pipeline later)</text></g><!--link t_sp to app--><g id="link_t_sp_app"><path d="M271.64,280.5469 C268.26,297.2769 265.31,323.0769 273,343.7969 C281.15,365.7569 294.8982,381.4733 309.4782,394.7133 " fill="none" id="t_sp-to-app" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="313.92,398.7469,309.9463,389.7352,310.2185,395.3855,304.5682,395.6577,313.92,398.7469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.291" x="274" y="339.8638">app is created by deploy...</text></g><!--link asp to app--><g id="link_asp_app"><path d="M529.83,296.9569 C478.21,328.4369 408.3119,371.0718 368.0919,395.6118 " fill="none" id="asp-to-app" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="362.97,398.7369,372.7362,397.4638,367.2382,396.1326,368.5694,390.6346,362.97,398.7369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.3091" x="476" y="339.8638">...but RUNS as its own SP</text></g><!--link app to cat--><g id="link_app_cat"><path d="M335,435.0369 C335,462.7569 335,511.5669 335,545.7969 " fill="none" id="app-to-cat" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="335,551.7969,339,542.7969,335,546.7969,331,542.7969,335,551.7969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.8555" x="336" y="502.8638">queries succeed only if</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.1777" x="339.3389" y="517.9966">the APP SP has grants</text></g><!--link asp to GMN14--><g id="link_asp_GMN14"><path d="M632.27,296.8269 C641.96,305.6169 651.25,315.7569 658,326.7969 C666.55,340.7869 671.78,357.9269 674.98,373.4169 " fill="none" id="asp-GMN14" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[NLDjQnin3FxkNo5Is9QGtDgrTAEmZR1UeL_Qa7GRWy1mxfJ4r94zMvSi_txINTgc-t27B3zwzEZ5xDWZFAprIuXmMoEnOuSPHl1p7U0smxXYHwkX796-clpeADfaDr25JGma-1dlXIHXnPPM7eyWDIvju_a1__BOknLj10sL_30POoiE2Ng3mLa1rxX57oAcmM1Ex_QXII277CXwy67bgDy3cuLl2oVbvSr5EJRF-PJYWr947_PjXjcafH5noW98MvT2c_ngJfcjyAq4D8IOGYt6WJn7EBafRpwMfw_9pmiOn_Z4QXiEeogXPQnXKavXF9aCv_HVeexIjfJVoa_bfJdcr3hOfXLo2-FVuZY-VzBulbFOGVC1c-CnTDeGAVJQibqaLprc5TjbZz7KwhPPWEMBEAZ4AssLQkJMOnx2DlXceyRE9bo79cDNWI2DKRcZqPTE9rp96BJL6Tv0QYWBYoEIydq84GBvVTzeBxi8CLu25WtLaauYPlSJu53RlGp1HVHEPkMbfQblsXWD5lqIgtydGWuTN-mFR4LH6FiAAPv5mp3zVZTJwOupX1t9t8pUAqwg4ToV1fDkU6wg2eLI9ODRpedb7SWq9GBMGh1AbZWRGu4H5e4vR20iTQW6uEGC27Vo1gHmJZPUTN0TnQ6xO8K-Py5o05tfZ7u9ilAQfZxULgW3Akxk_g5Z4UqQf42HNhGFL8otpmM19CVwII8uWl97EVrrl84m4bHl5z9ZUo-J6yB5wRdQX_NgmMT9uN9Xa6hGAly1]--></g></svg>