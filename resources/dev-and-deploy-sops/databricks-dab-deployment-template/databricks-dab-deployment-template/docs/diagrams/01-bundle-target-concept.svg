<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="346px" preserveAspectRatio="none" style="width:1072px;height:346px;background:#FFFFFF;" version="1.1" viewBox="0 0 1072 346" width="1072px" zoomAndPan="magnify"><title>The Core Mental Model - One Bundle, Many Targets</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="406.8203" x="325.6514" y="22.9951">The Core Mental Model - One Bundle, Many Targets</text><!--entity bundle--><g id="elem_bundle"><rect fill="#E8F0FE" height="117.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="274.2559" x="364.5" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.7236" x="417.0811" y="67.292">Project folder =</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="54.9199" x="531.2549" y="67.292">Bundle</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="254.2559" x="374.5" y="83.5889">(databricks.yml + resources/ + src/)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="499.4028" y="99.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.3057" x="406.4751" y="116.1826">Describes WHAT to deploy.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="181.8018" x="410.7271" y="132.4795">Never mentions a specific</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.3447" x="426.9556" y="148.7764">environment in code.</text></g><!--entity dev--><g id="elem_dev"><rect fill="#E6F4EA" height="101.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="274.748" x="7" y="239.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5928" x="102.5313" y="262.292">Target:</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.6426" x="157.5742" y="262.292">dev</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2002" x="78.2739" y="278.5889">catalog = proj_dev</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.7705" x="94.4888" y="294.8857">identity = you</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.6875" x="68.0303" y="311.1826">mode = development</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="254.748" x="17" y="327.4795">(names prefixed, schedules paused)</text></g><!--entity stg--><g id="elem_stg"><rect fill="#FEF7E0" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.7246" x="317.5" y="247.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5928" x="344.2002" y="270.292">Target:</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="59.2813" x="399.2432" y="270.292">staging</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.085" x="337.3198" y="286.5889">catalog = proj_stg</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7246" x="327.5" y="302.8857">identity = staging SP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.8164" x="333.4541" y="319.1826">mode = production</text></g><!--entity prd--><g id="elem_prd"><rect fill="#FCE8E6" height="85.1875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="158.5098" x="522" y="247.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.5928" x="555.4507" y="270.292">Target:</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="36.5654" x="610.4937" y="270.292">prod</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.5098" x="532" y="286.5889">catalog = proj_prod</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.9209" x="537.2944" y="302.8857">identity = prod SP</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.8164" x="533.3467" y="319.1826">mode = production</text></g><g id="elem_GMN9"><path d="M716,246.7969 L716,332.4609 L1065.123,332.4609 L1065.123,256.7969 L1055.123,246.7969 L716,246.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1055.123,246.7969 L1055.123,256.7969 L1065.123,256.7969 L1055.123,246.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.8931" x="750.5359" y="263.8638">A</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.7349" x="763.5613" y="263.8638">target</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.1587" x="813.4285" y="263.8638">answers WHERE and AS WHOM.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.123" x="722" y="278.9966">The same unchanged source deploys everywhere;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.9888" x="746.0671" y="294.1294">only ${var.catalog} and the identity differ.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.0527" x="747.0352" y="309.2622">"Promoting to prod" = deploying the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194.8223" x="788.6504" y="324.395">bundle with a different -t flag.</text></g><!--link bundle to dev--><g id="link_bundle_dev"><path d="M364.18,141.3569 C325.96,154.5769 285.4,171.4769 250.5,192.2969 C229.13,205.0469 212.6295,218.4239 195.1495,235.0339 " fill="none" id="bundle-to-dev" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="190.8,239.1669,200.0796,235.867,194.4246,235.7227,194.5689,230.0677,190.8,239.1669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.4814" x="251.5" y="205.3638">bundle deploy -t dev</text></g><!--link bundle to stg--><g id="link_bundle_stg"><path d="M418.55,162.5269 C410.49,171.5569 403.47,181.5069 398.5,192.2969 C390.71,209.1969 389.5756,223.6138 391.5456,241.2938 " fill="none" id="bundle-to-stg" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="392.21,247.2569,395.1887,237.8693,391.6563,242.2876,387.2379,238.7552,392.21,247.2569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.7295" x="399.5" y="205.3638">bundle deploy -t staging</text></g><!--link bundle to prd--><g id="link_bundle_prd"><path d="M544.38,162.3169 C550.83,172.0969 557.11,182.3169 562.5,192.2969 C571.86,209.6269 578.1761,224.093 584.8061,241.423 " fill="none" id="bundle-to-prd" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="586.95,247.0269,587.4701,237.1918,585.1634,242.357,579.9982,240.0503,586.95,247.0269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.3403" x="571.5" y="205.3638">bundle deploy -t prod</text></g><!--link bundle to GMN9--><g id="link_bundle_GMN9"><path d="M638.54,156.0769 C665.98,167.3569 694.39,179.7069 720.5,192.2969 C754.43,208.6569 790.9,228.9669 821.33,246.7369 " fill="none" id="bundle-GMN9" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[VPD1Qzj048Nl-XM3qqEZnaeE9GqfBRYfJ2zkGcteHL3MkoDvczMks5tP4Q7_lJEIQcmGlHZlwEsyxur6KKU3iDaXF3YFi48RXO6LKsXW3eyMuKjhbS4hM0dRmKRu2cD8mhEsZV2Y1kdgnbcwjeuTTV8eex2LmHE9mbAq9cxm9IwChcnDQf3qWpv9ZXTWzkJTRpf1wOn23vyWJGVpD2tiMoMYs7ejdqFMrGRUaLLmhPSOhkaGlBo-B6nXlsAGNcynmCzlYmr4H_QDSLrMsE-ufxRihfqD820qA7MfPK7yU-tTGAOjXLAOpK04sFO0S97VBM-M-HdkC8jxebIuPqH9XCPL1DvGabzKBQnMR1SxAdQkBMnDdUa_FKFZ6lQZQ5RKnDjuBFKBgYi8SeUgDLmJRK1rsQFG7UAuNRxF5zCO8OfAsse29SJg36LKmlhfI4GwrKgUJ6z6D-1YcIy_v3VJPgoVSEBocHKN_kFJU4K-3_bTVfiaux3dyyzzsFj_qn_U8CmZbqzLJ3cX6kETAjbdGiaqIM9THDYw65qDhXnL2S22SiO-SPg2iE60djSg_v7JIS5YJOV7LKPA_e02lKLehTpHh531i9oZLm3UlUwmGuyVIU-iwU3DwrxuR1pWdxvbf3x7uIbTbkYvFNyQjOlyocYX6NhMBn6txekZFKd7Y0STTxJXGmlUQWfR6b5b2P8D1_uB]--></g></svg>