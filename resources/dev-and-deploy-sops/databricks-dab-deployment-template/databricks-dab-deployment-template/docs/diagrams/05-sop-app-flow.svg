<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="922px" preserveAspectRatio="none" style="width:561px;height:922px;background:#FFFFFF;" version="1.1" viewBox="0 0 561 922" width="561px" zoomAndPan="magnify"><title>App Deployment SOP at a Glance - App-Specific Steps Marked (A)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="518.123" x="20" y="32.9951">App Deployment SOP at a Glance - App-Specific Steps Marked (A)</text><ellipse cx="280.5615" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="none" height="178.1406" style="stroke:#000000;stroke-width:1.5;" width="304.1523" x="128.4854" y="77.2969"/><path d="M359.4707,77.2969 L359.4707,86.5938 L349.4707,96.5938 L128.4854,96.5938 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.9854" x="131.4854" y="91.292">Stages 1-2 - Prepare &amp; Validate</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="226.5371" x="167.293" y="113.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.7676" x="177.293" y="134.7324">Same as job SOP - merge, tag,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.5371" x="177.293" y="148.7012">build shared wheel, tests, validate</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="284.1523" x="138.4854" y="181.5313"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.2793" x="148.4854" y="202.6699">(A) Check app.yaml command and that</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.0586" x="148.4854" y="216.6387">every env var the code reads is declared</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="264.1523" x="148.4854" y="230.6074">(a missing var fails at STARTUP, not deploy)</text><rect fill="none" height="232.1094" style="stroke:#000000;stroke-width:1.5;" width="296.4766" x="132.3232" y="265.4375"/><path d="M259.1084,265.4375 L259.1084,274.7344 L249.1084,284.7344 L132.3232,284.7344 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.7852" x="135.3232" y="279.4326">Stage 3 - Deploy</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="258.9336" x="151.0947" y="301.7344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.9336" x="161.0947" y="322.873">Authenticate as target's deployment SP</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="158.7324" x="201.1953" y="355.7031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.7324" x="211.1953" y="376.8418">bundle deploy -t target</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.2969" x="211.1953" y="390.8105">(syncs source only)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="276.4766" x="142.3232" y="423.6406"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.3418" x="152.3232" y="444.7793">(A) bundle run app - START or RESTART</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.4766" x="152.3232" y="458.748">("deployed" and "serving the new version"</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138.1992" x="152.3232" y="472.7168">are two different facts)</text><rect fill="none" height="246.0781" style="stroke:#000000;stroke-width:1.5;" width="287.002" x="137.0605" y="507.5469"/><path d="M255.875,507.5469 L255.875,516.8438 L245.875,526.8438 L137.0605,526.8438 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108.8145" x="140.0605" y="521.542">Stage 4 - Verify</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="208.5078" x="176.3076" y="543.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.5078" x="186.3076" y="564.9824">(A) Poll app URL until HTTP 200</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.0371" x="186.3076" y="578.9512">(allow a startup window)</text><rect fill="#F1F1F1" height="61.9063" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="267.002" x="147.0605" y="611.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.4746" x="157.0605" y="632.9199">(A) Exercise ONE read path that queries</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="225.3691" x="157.0605" y="646.8887">the catalog - the step that proves the</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.002" x="157.0605" y="660.8574">APP SP's grants work in this environment</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="156.4238" x="202.3496" y="693.6875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="135.7031" x="212.3496" y="714.8262">staging - pytest -k app</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.4238" x="212.3496" y="728.7949">prod - notify app users</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="223.1621" x="168.9805" y="822.0273"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.4766" x="178.9805" y="843.166">Rollback = previous tag +</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203.1621" x="178.9805" y="857.1348">Stages 3-4 INCLUDING the restart</text><ellipse cx="280.5615" cy="900.9648" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="280.5615" cy="900.9648" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><polygon fill="#F1F1F1" points="256.9771,773.625,304.146,773.625,316.146,785.625,304.146,797.625,256.9771,797.625,244.9771,785.625,256.9771,773.625" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="284.5615" y="807.8354">no</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="47.1689" x="256.9771" y="789.4331">healthy?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="316.146" y="783.0308">yes</text><ellipse cx="357.1543" cy="785.625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="357.1543" cy="785.625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="280.5615" x2="280.5615" y1="161.5313" y2="181.5313"/><polygon fill="#181818" points="276.5615,171.5313,280.5615,181.5313,284.5615,171.5313,280.5615,175.5313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="280.5615" x2="280.5615" y1=